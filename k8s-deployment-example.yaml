# Example Kubernetes deployment for service-payment (Default and Jenga API)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-payment-default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-payment-default
  template:
    metadata:
      labels:
        app: service-payment-default
    spec:
      containers:
        - name: default
          image: ghcr.io/antinvestor/service-payment/default:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/ready
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/ready
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          env:
            # Add your environment variables here
            - name: EXAMPLE_ENV
              value: "value"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-payment-jenga-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-payment-jenga-api
  template:
    metadata:
      labels:
        app: service-payment-jenga-api
    spec:
      containers:
        - name: jenga-api
          image: ghcr.io/antinvestor/service-payment/jenga-api:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/ready
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/ready
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          env:
            - name: JENGA_PRIVATE_KEY_PATH
              value: "/keys/privatekey.pem"
            # NATS queue URIs — REQUIRED for production (without these, subscribers are disabled)
            - name: QUEUE_JENGA_PAYMENT_URI
              value: "nats://nats-server:4222?subject=jenga.payments.dequeue"
            - name: QUEUE_JENGA_PROMPT_URI
              value: "nats://nats-server:4222?subject=jenga.prompts.dequeue"
          volumeMounts:
            - name: keys
              mountPath: /keys
              readOnly: true
      volumes:
        - name: keys
          secret:
            secretName: jenga-api-keys
---
apiVersion: v1
kind: Service
metadata:
  name: service-payment-default
spec:
  selector:
    app: service-payment-default
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: service-payment-jenga-api
spec:
  selector:
    app: service-payment-jenga-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
