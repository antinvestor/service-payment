# Per-module dart codegen for ledger. Invoked by proto-generate-dart as:
#   buf generate --template buf.gen.dart.ledger.yaml ledger
version: v2
managed:
  enabled: true

plugins:
  - remote: buf.build/protocolbuffers/dart:v21.1.2
    out: ../sdk/dart/ledger/lib/src
    include_imports: true
    include_wkt: true

  - remote: buf.build/connectrpc/dart
    out: ../sdk/dart/ledger/lib/src
    include_imports: true
    include_wkt: true
