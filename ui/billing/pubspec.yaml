name: antinvestor_ui_billing
description: >
  Billing management UI library for Antinvestor. Embeddable screens and widgets
  for catalogs, subscriptions, usage-based billing, invoicing, credits, and
  discounts.
version: 0.1.1
repository: https://github.com/antinvestor/service-payment
homepage: https://github.com/antinvestor/service-payment/tree/main/ui/billing
issue_tracker: https://github.com/antinvestor/service-payment/issues
topics:
  - flutter
  - ui
  - billing
  - antinvestor
  - subscriptions

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  antinvestor_ui_core: ^0.1.0
  antinvestor_api_billing: ^0.1.0
  antinvestor_api_common: ^1.52.0
  connectrpc: ^1.0.0
  fixnum: ^1.1.0
  flutter_riverpod: ^3.2.1
  go_router: ^17.1.0
  protobuf: ^4.2.0
  riverpod_annotation: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  riverpod_generator: ^4.0.3

flutter:
  uses-material-design: true
