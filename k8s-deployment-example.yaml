# Kubernetes deployment for service-payment
#
# NATS JetStream Architecture:
#
#   All queue communication uses NATS JetStream for reliable, persistent delivery.
#   JetStream guarantees messages survive consumer restarts and NATS server restarts.
#
#   Two publish-subscribe flows:
#
#   1. ROUTED PAYMENTS (disbursements/receives):
#      payment-default publishes to Route.URI stored in the database.
#      Each Route row has a JetStream URI as its URI field.
#      The integration subscribes to the same subject via QUEUE_*_PAYMENT_URI.
#
#   2. PROMPTS / PAYMENT LINKS (direct):
#      payment-default publishes to INITIATE_PROMPT_TOPIC_URI / PAYMENT_LINK_TOPIC_URI.
#      The target integration subscribes to the same subject via QUEUE_*_PROMPT_URI.
#      Only ONE integration handles each direct topic per deployment.
#
#   Subject naming convention: svc.payment.<integration>.<purpose>
#   Stream naming convention:  svc_payment_<integration>
#
# Database Route seeding (for routed payments):
#   INSERT INTO routes (id, name, route_type, mode, uri, partition_id, tenant_id)
#   VALUES ('route-jenga-tx', 'Jenga Disbursement', 'bank_transfer', 'tx',
#     'nats://$(QUEUE_USERNAME):$(QUEUE_PASSWORD)@queue.datastore.svc.cluster.local:4222?subject=svc.payment.jenga.payments&jetstream=true&stream_name=svc_payment_jenga&stream_subjects=svc.payment.jenga.%3E&stream_retention=workqueue&stream_storage=file&consumer_durable_name=svc_payment_jenga_payments&consumer_ack_policy=explicit&consumer_deliver_policy=all&consumer_replay_policy=instant',
#     '<partition-id>', '<tenant-id>');
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-payment-default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-payment-default
  template:
    metadata:
      labels:
        app: service-payment-default
    spec:
      containers:
        - name: default
          image: ghcr.io/antinvestor/service-payment/default:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          env:
            # NATS JetStream: prompt publisher — subject must match the integration's QUEUE_*_PROMPT_URI
            - name: INITIATE_PROMPT_TOPIC_URI
              value: "nats://$(QUEUE_USERNAME):$(QUEUE_PASSWORD)@queue.datastore.svc.cluster.local:4222?subject=svc.payment.jenga.prompts&jetstream=true&stream_name=svc_payment_jenga&stream_subjects=svc.payment.jenga.%3E&stream_retention=workqueue&stream_storage=file"
            - name: PAYMENT_LINK_TOPIC_URI
              value: "nats://$(QUEUE_USERNAME):$(QUEUE_PASSWORD)@queue.datastore.svc.cluster.local:4222?subject=svc.payment.jenga.payment_links&jetstream=true&stream_name=svc_payment_jenga&stream_subjects=svc.payment.jenga.%3E&stream_retention=workqueue&stream_storage=file"
            # NATS credentials from secret
            - name: QUEUE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: nats-credentials
                  key: username
            - name: QUEUE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nats-credentials
                  key: password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-payment-jenga-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-payment-jenga-api
  template:
    metadata:
      labels:
        app: service-payment-jenga-api
    spec:
      containers:
        - name: jenga-api
          image: ghcr.io/antinvestor/service-payment/jenga-api:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          env:
            - name: JENGA_PRIVATE_KEY_PATH
              value: "/keys/privatekey.pem"
            # NATS JetStream: payment subscriber — subject matches Route.URI in the database
            - name: QUEUE_JENGA_PAYMENT_URI
              value: "nats://$(QUEUE_USERNAME):$(QUEUE_PASSWORD)@queue.datastore.svc.cluster.local:4222?subject=svc.payment.jenga.payments&jetstream=true&stream_name=svc_payment_jenga&stream_subjects=svc.payment.jenga.%3E&stream_retention=workqueue&stream_storage=file&consumer_durable_name=svc_payment_jenga_payments&consumer_ack_policy=explicit&consumer_deliver_policy=all&consumer_replay_policy=instant"
            # NATS JetStream: prompt subscriber — subject matches INITIATE_PROMPT_TOPIC_URI in payment-default
            - name: QUEUE_JENGA_PROMPT_URI
              value: "nats://$(QUEUE_USERNAME):$(QUEUE_PASSWORD)@queue.datastore.svc.cluster.local:4222?subject=svc.payment.jenga.prompts&jetstream=true&stream_name=svc_payment_jenga&stream_subjects=svc.payment.jenga.%3E&stream_retention=workqueue&stream_storage=file&consumer_durable_name=svc_payment_jenga_prompts&consumer_ack_policy=explicit&consumer_deliver_policy=all&consumer_replay_policy=instant"
            # NATS credentials from secret
            - name: QUEUE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: nats-credentials
                  key: username
            - name: QUEUE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nats-credentials
                  key: password
          volumeMounts:
            - name: keys
              mountPath: /keys
              readOnly: true
      volumes:
        - name: keys
          secret:
            secretName: jenga-api-keys
---
apiVersion: v1
kind: Service
metadata:
  name: service-payment-default
spec:
  selector:
    app: service-payment-default
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: service-payment-jenga-api
spec:
  selector:
    app: service-payment-jenga-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
