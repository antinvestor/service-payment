syntax = "proto3";

package checkout.v1;

import "buf/validate/validate.proto";
import "common/v1/money.proto";
import "common/v1/permissions.proto";

enum AmountOption {
  AMOUNT_OPTION_FIXED_UNSPECIFIED = 0;
  AMOUNT_OPTION_VARIABLE = 1;
}

enum SessionStatus {
  SESSION_STATUS_PENDING_UNSPECIFIED = 0;
  SESSION_STATUS_PROCESSING = 1;
  SESSION_STATUS_COMPLETED = 2;
  SESSION_STATUS_FAILED = 3;
  SESSION_STATUS_EXPIRED = 4;
}

message PayerContact {
  string contact_id = 1;
  string msisdn = 2;
}

message PayerPrefill {
  string profile_id = 1;
  string display_name = 2;
  string language = 3;
  repeated PayerContact contacts = 4;
  // Email used for card customers when the profile has no EMAIL contact.
  string email = 5;
}

// PaymentMethod is one rail the hosted page can offer.
message PaymentMethod {
  // Registry key passed in CreateCheckoutSessionRequest.methods.
  string key = 1;
  // Display name.
  string name = 2;
  // Payment service route (integration) that collects on this rail.
  string route = 3;
  // card | mobile_money | bank_transfer.
  string method_type = 4;
  // push (prompt on the payer's phone), redirect (provider page) or embed.
  string flow = 5;
  // ISO 4217 currencies accepted (empty = any).
  repeated string currencies = 6;
  // ISO 3166-1 alpha-2 countries served (empty = any).
  repeated string countries = 7;
  // Only whole currency units can be charged.
  bool whole_amounts = 8;
  // The provider manages recurring billing itself (Polar, Stripe).
  bool subscriptions = 9;
  // A provider product reference (product_id metadata) is required.
  bool requires_product_id = 10;
}

message CheckoutSession {
  string ref = 1;
  string name = 2;
  string description = 3;
  common.v1.Money amount = 4;
  AmountOption amount_option = 5;
  string order_ref = 6;
  map<string, string> metadata = 7;
  string return_url = 8;
  PayerPrefill payer = 9;
  SessionStatus status = 10;
  string prompt_id = 11;
  string page_url = 12;
  string expires_at = 13; // RFC3339
  string payment_id = 14;
  // Browser landing when the payer abandons the page (optional).
  string cancel_url = 15;
}

message CheckoutLink {
  string ref = 1;
  string name = 2;
  string description = 3;
  common.v1.Money amount = 4;
  AmountOption amount_option = 5;
  string order_ref = 6;
  map<string, string> metadata = 7;
  string return_url = 8;
  string page_url = 9;
  string expires_at = 10; // RFC3339, empty = no expiry
  bool active = 11;
  string cancel_url = 12;
}

message CreateCheckoutSessionRequest {
  string name = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 100
  ];
  string description = 2 [(buf.validate.field).string.max_len = 500];
  common.v1.Money amount = 3;
  AmountOption amount_option = 4;
  string order_ref = 5 [(buf.validate.field).string.max_len = 250];
  map<string, string> metadata = 6;
  string return_url = 7 [(buf.validate.field).string.uri = true];
  PayerPrefill payer = 8;
  repeated string methods = 9; // optional restriction; method registry keys
  // Optional browser landing when the payer abandons the page.
  string cancel_url = 10 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uri = true
  ];
}

message CreateCheckoutSessionResponse {
  CheckoutSession data = 1;
}

message GetCheckoutSessionRequest {
  string ref = 1 [
    (buf.validate.field).string.min_len = 8,
    (buf.validate.field).string.max_len = 64
  ];
}

message GetCheckoutSessionResponse {
  CheckoutSession data = 1;
}

message CreateCheckoutLinkRequest {
  string name = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 100
  ];
  string description = 2 [(buf.validate.field).string.max_len = 500];
  common.v1.Money amount = 3;
  AmountOption amount_option = 4;
  string order_ref = 5 [(buf.validate.field).string.max_len = 250];
  map<string, string> metadata = 6;
  string return_url = 7 [(buf.validate.field).string.uri = true];
  string expires_at = 8; // RFC3339, empty = no expiry
  string cancel_url = 9 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uri = true
  ];
}

// ListPaymentMethodsRequest asks which rails a session with these
// properties would be offered, so product apps can show choices or pick
// methods[] before creating a session.
message ListPaymentMethodsRequest {
  // ISO 4217 currency (empty = any).
  string currency = 1 [(buf.validate.field).string.max_len = 3];
  // Decimal amount; filters whole-unit rails (empty = any).
  string amount = 2 [(buf.validate.field).string.max_len = 40];
  // ISO 3166-1 alpha-2 payer country (empty = unknown).
  string country = 3 [(buf.validate.field).string.max_len = 2];
  // Payer MSISDNs for phone-local rails.
  repeated string phones = 4;
  // Restrict to these keys (empty = all).
  repeated string methods = 5;
  // Metadata the session would carry (product_id enables product rails).
  map<string, string> metadata = 6;
}

message ListPaymentMethodsResponse {
  repeated PaymentMethod data = 1;
  // Key the hosted page would preselect.
  string selected = 2;
}

message CreateCheckoutLinkResponse {
  CheckoutLink data = 1;
}

service CheckoutService {
  option (common.v1.service_permissions) = {
    namespace: "service_checkout"
    permissions: [
      "checkout_session_create",
      "checkout_session_view",
      "checkout_link_create"
    ]
    role_bindings: [
      {
        role: ROLE_OWNER
        permissions: [
          "checkout_session_create",
          "checkout_session_view",
          "checkout_link_create"
        ]
      }
    ]
  };

  // CreateCheckoutSession creates a single-use hosted payment session and
  // returns the page URL the payer should be redirected to.
  rpc CreateCheckoutSession(CreateCheckoutSessionRequest) returns (CreateCheckoutSessionResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["checkout_session_create"]
    };
  }

  // GetCheckoutSession returns the current state of a checkout session;
  // merchants poll this as one source of payment truth.
  rpc GetCheckoutSession(GetCheckoutSessionRequest) returns (GetCheckoutSessionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.method_permissions) = {
      permissions: ["checkout_session_view"]
    };
  }

  // ListPaymentMethods returns the rails available for the caller's
  // partition and the given currency / amount / locality.
  rpc ListPaymentMethods(ListPaymentMethodsRequest) returns (ListPaymentMethodsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.method_permissions) = {
      permissions: ["checkout_session_view"]
    };
  }
  // CreateCheckoutLink creates a reusable, shareable link that spawns a
  // fresh checkout session per visitor.
  rpc CreateCheckoutLink(CreateCheckoutLinkRequest) returns (CreateCheckoutLinkResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["checkout_link_create"]
    };
  }
}
