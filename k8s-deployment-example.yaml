# Example Kubernetes deployment for service-payment
#
# NATS Architecture:
#   The payment service uses NATS for two message flows:
#
#   1. ROUTED PAYMENTS (disbursements/receives):
#      payment-default publishes to Route.URI from the database.
#      Each Route row points to a NATS subject (e.g., nats://...?subject=jenga.payments.dequeue).
#      The integration service subscribes to that same subject via QUEUE_*_PAYMENT_URI.
#
#   2. PROMPTS / PAYMENT LINKS (direct):
#      payment-default publishes to INITIATE_PROMPT_TOPIC_URI / PAYMENT_LINK_TOPIC_URI.
#      The integration that handles prompts subscribes to the SAME subject via QUEUE_*_PROMPT_URI.
#      Only ONE integration should subscribe to each direct topic per deployment.
#
#   Subject matching is critical: the publisher subject MUST equal the subscriber subject.
#
# Database Route seeding example (for routed payments):
#   INSERT INTO routes (id, name, route_type, mode, uri, partition_id, tenant_id)
#   VALUES ('route-jenga-tx', 'Jenga Disbursement', 'bank_transfer', 'tx',
#           'nats://nats-server:4222?subject=jenga.payments.dequeue',
#           '<partition-id>', '<tenant-id>');
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-payment-default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-payment-default
  template:
    metadata:
      labels:
        app: service-payment-default
    spec:
      containers:
        - name: default
          image: ghcr.io/antinvestor/service-payment/default:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          env:
            # NATS: prompt/payment-link publisher topics
            # The subject here must match the integration subscriber's QUEUE_*_PROMPT_URI subject
            - name: INITIATE_PROMPT_TOPIC_URI
              value: "nats://nats-server:4222?subject=jenga.prompts.dequeue"
            - name: PAYMENT_LINK_TOPIC_URI
              value: "nats://nats-server:4222?subject=jenga.payment_links.dequeue"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-payment-jenga-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-payment-jenga-api
  template:
    metadata:
      labels:
        app: service-payment-jenga-api
    spec:
      containers:
        - name: jenga-api
          image: ghcr.io/antinvestor/service-payment/jenga-api:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          env:
            - name: JENGA_PRIVATE_KEY_PATH
              value: "/keys/privatekey.pem"
            # NATS: subscriber queues — subjects must match the publishers
            # Payment queue: matches Route.URI in the database
            - name: QUEUE_JENGA_PAYMENT_URI
              value: "nats://nats-server:4222?subject=jenga.payments.dequeue"
            # Prompt queue: matches INITIATE_PROMPT_TOPIC_URI in the payment-default service
            - name: QUEUE_JENGA_PROMPT_URI
              value: "nats://nats-server:4222?subject=jenga.prompts.dequeue"
          volumeMounts:
            - name: keys
              mountPath: /keys
              readOnly: true
      volumes:
        - name: keys
          secret:
            secretName: jenga-api-keys
---
apiVersion: v1
kind: Service
metadata:
  name: service-payment-default
spec:
  selector:
    app: service-payment-default
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: service-payment-jenga-api
spec:
  selector:
    app: service-payment-jenga-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
