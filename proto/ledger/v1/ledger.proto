syntax = "proto3";

package ledger.v1;

// -----------------------------------------------------
// Core notes (normative):
// - Ledger Service provides double-entry bookkeeping and financial accounting
// - Supports hierarchical chart of accounts with ledger types
// - All transactions follow double-entry principles (debits = credits)
// - Supports transaction reversals and reservations for pending transactions
// - All monetary amounts use common.v1.Money for currency safety
// -----------------------------------------------------

import "buf/validate/validate.proto";
import "common/v1/common.proto";
import "common/v1/money.proto";
import "common/v1/permissions.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/antinvestor/apis/go/ledger/v1;ledgerv1";
option java_multiple_files = true;
option java_package = "ledgerv1";
option (gnostic.openapi.v3.document) = {
  info: {
    title: "Ledger Service"
    version: "v1.0.0"
    description: "The Ledger Service provides double-entry bookkeeping and financial accounting capabilities. It supports hierarchical chart of accounts, multi-currency transactions, transaction reversals, and balance tracking. The service follows standard accounting principles with ledger types (Asset, Liability, Income, Expense, Capital) and ensures all transactions are balanced (debits equal credits). Supports both cleared and uncleared transactions with reservation capabilities for pending operations."
    contact: {
      name: "Ant Investor Ltd"
      url: "https://github.com/antinvestor/service-ledger"
      email: "info@antinvestor.com"
    }
    license: {
      name: "Apache License"
      url: "https://github.com/antinvestor/apis/blob/master/LICENSE"
    }
  }
  components: {
    security_schemes: {
      additional_properties: [
        {
          name: "BearerAuth"
          value: {
            security_scheme: {
              type: "http"
              scheme: "bearer"
              bearer_format: "JWT"
            }
          }
        }
      ]
    }
  }
};

// -----------------------------------------------------
// Enumerations
// -----------------------------------------------------

// LedgerType defines the fundamental accounting categories.
// Based on standard accounting equation: Assets = Liabilities + Capital + (Income - Expenses)
// buf:lint:ignore ENUM_VALUE_PREFIX
enum LedgerType {
  // buf:lint:ignore ENUM_ZERO_VALUE_SUFFIX
  ASSET = 0; // Resources owned (cash, receivables, inventory, equipment)
  LIABILITY = 1; // Obligations owed (payables, loans, accrued expenses)
  INCOME = 2; // Revenue and gains (sales, interest income, fees)
  EXPENSE = 3; // Costs and losses (salaries, rent, utilities, depreciation)
  CAPITAL = 4; // Owner's equity (investments, retained earnings)
}

// TransactionType defines the nature of a transaction.
// buf:lint:ignore ENUM_VALUE_PREFIX
enum TransactionType {
  // buf:lint:ignore ENUM_ZERO_VALUE_SUFFIX
  NORMAL = 0; // Standard transaction
  REVERSAL = 1; // Reverses a previous transaction (creates offsetting entries)
  RESERVATION = 2; // Temporary hold/reservation (e.g., pending payment authorization)
}

// TransactionStatus drives the transaction lifecycle.
//   PENDING  — submitted, awaiting settlement; contributes to un_cleared_balance
//   POSTED   — confirmed/settled; contributes to balance; immutable except for
//              the auto-transition to REVERSED when a REVERSAL is posted
//   REVERSED — was posted, then offset by a REVERSAL whose entries cancel
//              this one's balance impact
//   VOIDED   — was draft or pending, then cancelled administratively
//   FAILED   — posting rejected by upstream system; no balance impact
//   DRAFT    — created but not submitted; no balance impact
// buf:lint:ignore ENUM_VALUE_PREFIX
enum TransactionStatus {
  // buf:lint:ignore ENUM_ZERO_VALUE_SUFFIX
  PENDING = 0; // Awaiting settlement
  POSTED = 1; // Confirmed and contributes to balance
  REVERSED = 2; // Posted then offset by a REVERSAL
  VOIDED = 3; // Cancelled before posting
  FAILED = 4; // Rejected by upstream system
  DRAFT = 5; // Not yet submitted
}

// AccountType is the per-account classification, finer-grained than
// LedgerType so contra, clearing, suspense and memo accounts can live
// under their natural parent ledgers without overloading the type.
// buf:lint:ignore ENUM_VALUE_PREFIX
enum AccountType {
  // buf:lint:ignore ENUM_ZERO_VALUE_SUFFIX
  ACCOUNT_ASSET = 0;
  ACCOUNT_LIABILITY = 1;
  ACCOUNT_EQUITY = 2;
  ACCOUNT_INCOME = 3;
  ACCOUNT_EXPENSE = 4;
  ACCOUNT_CONTRA_ASSET = 5;
  ACCOUNT_CONTRA_LIABILITY = 6;
  ACCOUNT_CONTRA_INCOME = 7;
  ACCOUNT_CONTRA_EXPENSE = 8;
  ACCOUNT_CLEARING = 9;
  ACCOUNT_SUSPENSE = 10;
  ACCOUNT_MEMO = 11;
}

// NormalBalance is the side an account's balance accumulates on. DEADCLIC
// stores +amount when an entry's side equals the normal balance, -amount
// when it is the opposite. NONE opts a memo account out of normalisation.
// buf:lint:ignore ENUM_VALUE_PREFIX
enum NormalBalance {
  // buf:lint:ignore ENUM_ZERO_VALUE_SUFFIX
  DEBIT = 0;
  CREDIT = 1;
  NONE = 2;
}

// -----------------------------------------------------
// Core Data Types
// -----------------------------------------------------

// Ledger represents a category in the chart of accounts.
// Ledgers can be hierarchical with parent-child relationships.
message Ledger {
  string id = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ]; // Unique reference/code for the ledger (e.g., "1000", "CASH")
  LedgerType type = 2; // Accounting category type
  string parent = 3; // Parent ledger reference for hierarchical structure
  google.protobuf.Struct data = 4; // Additional ledger metadata (name, description, etc.)
  string book_id = 5; // Optional Book this ledger belongs to; empty for legacy/global rows
}

// Account represents a specific account within a ledger.
// Tracks balances and supports multi-currency operations.
message Account {
  string id = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ]; // Unique account reference/number
  string ledger = 3; // Ledger this account belongs to
  common.v1.Money balance = 4; // Current cleared balance
  google.protobuf.Struct data = 5; // Additional account metadata (owner, description, etc.)
  common.v1.Money uncleared_balance = 6; // Balance including uncleared transactions
  common.v1.Money reserved_balance = 7; // Amount held in reservations
  AccountType account_type = 8; // Per-account classification (assets/liabilities/contra/clearing/...)
  NormalBalance normal_balance = 9; // Side on which the balance accumulates
  string book_id = 10; // Book this account belongs to; empty for legacy/global rows
}

// TransactionEntry represents one side of a double-entry transaction.
// Each transaction must have at least two entries with balanced debits and credits.
message TransactionEntry {
  string id = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ]; // Account reference for this entry
  string account_id = 3; // Account reference for this entry
  string transaction_id = 4; // Transaction reference this entry belongs to
  string transacted_at = 5; // Transaction timestamp (RFC3339)
  common.v1.Money amount = 7; // Amount for this entry
  bool credit = 8; // True if credit, false if debit
  common.v1.Money acc_balance = 9; // Account balance after this entry
  string cleared_at = 11; // When this entry was cleared (RFC3339)
}

// Transaction represents a complete double-entry transaction.
// Must contain balanced entries (sum of debits = sum of credits).
message Transaction {
  string id = 1; // Unique transaction reference/ID
  // The three-letter currency code defined in ISO 4217.
  string currency_code = 2; // Currency code for all entries (ISO 4217)
  string transacted_at = 3; // Transaction timestamp (RFC3339)
  google.protobuf.Struct data = 4; // Additional transaction metadata (description, source, etc.)
  repeated TransactionEntry entries = 5; // Transaction entries (must be balanced)
  bool cleared = 6; // Deprecated: use status. Kept for backward compatibility; true iff status == POSTED.
  TransactionType type = 7; // Transaction type (normal, reversal, reservation)
  TransactionStatus status = 8; // Lifecycle state (pending / posted / reversed / voided / failed / draft)
  string idempotency_key = 9; // Caller-supplied dedup token; partial UNIQUE at the DB layer
  string external_ref = 10; // Provider/external system reference (mobile money txn id, etc.)
  string source = 11; // Origin of the posting (e.g. "mtn", "manual_admin")
  string book_id = 12; // Book this transaction belongs to; empty for legacy/global rows
  string posted_at = 13; // When status moved to POSTED (RFC3339); empty when not yet posted
  string voided_at = 14; // When status moved to VOIDED (RFC3339); empty otherwise
  string reversed_transaction_id = 15; // Set on REVERSAL rows pointing back at the original
}

// Book is an independent accounting scope — one entity's complete set of
// financial records. Examples by convention: "platform" (the company's own
// book), "group" (a savings group / chama / SACCO / branch), "customer"
// (an individual member), "merchant", "agent". Type is a free-form string
// so product domains can grow new entity classifications without a
// migration. ParentID supports hierarchy (organisation → groups → members)
// for consolidated reporting; cross-book posting remains strict regardless.
message Book {
  string id = 1; // Unique book reference/ID
  string name = 2; // Display name (e.g. "Village Group A", "Member Jane Doe")
  string type = 3; // Conventional type ("platform"/"group"/"customer"/"merchant"/"agent"/"branch")
  string parent_id = 4; // Optional parent book for hierarchical scope
  string currency = 5; // Default currency for this book (ISO 4217)
  google.protobuf.Struct data = 6; // Additional metadata
}

// TrialBalanceLine is one row of the trial balance — a single account's
// raw debit and credit totals plus the DEADCLIC-signed net balance.
message TrialBalanceLine {
  string account_id = 1;
  string ledger_id = 2;
  LedgerType ledger_type = 3;
  string currency = 4;
  common.v1.Money total_debits = 5;
  common.v1.Money total_credits = 6;
  common.v1.Money net_balance = 7;
}

// TrialBalanceTotal aggregates one currency's debits and credits across
// every line in the report. is_balanced is the textbook integrity check.
message TrialBalanceTotal {
  string currency = 1;
  common.v1.Money total_debits = 2;
  common.v1.Money total_credits = 3;
  bool is_balanced = 4;
}

// StatementEntry is one row on an account statement, hydrated with its
// parent transaction's metadata and the running balance after the entry.
message StatementEntry {
  string entry_id = 1;
  string transaction_id = 2;
  string transacted_at = 3; // RFC3339
  TransactionType transaction_type = 4;
  common.v1.Money amount = 5;
  bool credit = 6;
  common.v1.Money running_balance = 7;
  google.protobuf.Struct transaction_data = 8;
  string cleared_at = 9; // RFC3339
}

// -----------------------------------------------------
// Request/Response Messages
// -----------------------------------------------------

// SearchLedgersResponse returns ledgers matching search criteria.
message SearchLedgersResponse {
  repeated Ledger data = 1; // List of matching ledgers
}

// CreateLedgerRequest creates a new ledger in the chart of accounts.
message CreateLedgerRequest {
  string id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ]; // Optional Unique reference/code for the ledger (e.g., "1000", "CASH")
  LedgerType type = 2; // Accounting category type
  string parent_id = 3; // Parent ledger reference for hierarchical structure
  google.protobuf.Struct data = 4; // Additional ledger metadata (name, description, etc.)
}

// CreateLedgerResponse returns the newly created ledger.
message CreateLedgerResponse {
  Ledger data = 1; // The created ledger
}

// UpdateLedgerRequest updates an existing ledger's metadata.
message UpdateLedgerRequest {
  string id = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ]; // Unique reference/code for the ledger (e.g., "1000", "CASH")
  google.protobuf.Struct data = 4; // Additional ledger metadata (name, description, etc.)
}

// UpdateLedgerResponse returns the updated ledger.
message UpdateLedgerResponse {
  Ledger data = 1; // The updated ledger
}

// SearchAccountsResponse returns accounts matching search criteria.
message SearchAccountsResponse {
  repeated Account data = 1; // List of matching accounts
}

// CreateAccountRequest creates a new account within a ledger.
message CreateAccountRequest {
  string id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ]; // Optional Unique account reference/number
  string ledger_id = 3; // Ledger this account belongs to
  string currency = 4; // Current cleared balance
  google.protobuf.Struct data = 5; // Additional account metadata (owner, description, etc.)
}

// CreateAccountResponse returns the newly created account.
message CreateAccountResponse {
  Account data = 1; // The created account
}

// UpdateAccountRequest updates an existing account's metadata.
message UpdateAccountRequest {
  string id = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ]; // Unique reference/code for the account (e.g., "1000", "CASH")
  google.protobuf.Struct data = 4; // Additional ledger metadata (name, description, etc.)
}

// UpdateAccountResponse returns the updated account.
message UpdateAccountResponse {
  Account data = 1; // The updated account
}

// SearchTransactionsResponse returns transactions matching search criteria.
message SearchTransactionsResponse {
  repeated Transaction data = 1; // List of matching transactions
}

// CreateTransactionRequest creates a new double-entry transaction.
message CreateTransactionRequest {
  string id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ]; // Unique transaction reference/ID
  string currency = 2; // Currency code for all entries (ISO 4217)
  string transacted_at = 3; // Transaction timestamp (RFC3339)
  google.protobuf.Struct data = 4; // Additional transaction metadata (description, source, etc.)
  repeated TransactionEntry entries = 5; // Transaction entries (must be balanced)
  bool cleared = 6; // Whether transaction has been cleared/posted
  TransactionType type = 7; // Transaction type (normal, reversal, reservation)
}

// CreateTransactionResponse returns the newly created transaction.
message CreateTransactionResponse {
  Transaction data = 1; // The created transaction
}

// ReverseTransactionRequest reverses a transaction by creating offsetting entries.
message ReverseTransactionRequest {
  string id = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ]; // Unique transaction reference/ID
}

// ReverseTransactionResponse returns the reversal transaction.
message ReverseTransactionResponse {
  Transaction data = 1; // The created reversal transaction
}

// UpdateTransactionRequest updates a transaction's metadata.
message UpdateTransactionRequest {
  string id = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ]; // Optional Unique reference/code for the transaction (e.g., "1000", "CASH")
  string cleared_at = 2; // Transaction timestamp (RFC3339)
  google.protobuf.Struct data = 4; // Additional ledger metadata (name, description, etc.)
}

// UpdateTransactionResponse returns the updated transaction.
message UpdateTransactionResponse {
  Transaction data = 1; // The updated transaction
}

// SearchTransactionEntriesResponse returns transaction entries matching search criteria.
message SearchTransactionEntriesResponse {
  repeated TransactionEntry data = 1; // List of matching transaction entries
}

// -----------------------------------------------------
// Book request/response messages
// -----------------------------------------------------

message CreateBookRequest {
  string id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ]; // Optional unique reference; generated when omitted
  string name = 2; // Display name
  string type = 3; // Conventional type ("platform"/"group"/"customer"/...)
  string parent_id = 4; // Optional parent book for hierarchical scope
  string currency = 5; // Default currency for this book (ISO 4217)
  google.protobuf.Struct data = 6; // Additional metadata
}

message CreateBookResponse {
  Book data = 1;
}

message GetBookRequest {
  string id = 1;
}

message GetBookResponse {
  Book data = 1;
}

message ListBooksByTypeRequest {
  string type = 1; // Conventional book type
}

message ListBooksByTypeResponse {
  repeated Book data = 1;
}

// -----------------------------------------------------
// Report request/response messages
// -----------------------------------------------------

message GetTrialBalanceRequest {
  string currency = 1; // Optional ISO 4217 filter
  string ledger_id = 2; // Optional scope to one chart-of-accounts subtree
  LedgerType ledger_type = 3; // Optional filter by category
  repeated string book_ids = 4; // Optional scope; expand via ListBookDescendants for consolidation
  string as_of = 5; // Optional RFC3339 upper bound on transacted_at
}

message GetTrialBalanceResponse {
  repeated TrialBalanceLine lines = 1;
  repeated TrialBalanceTotal totals = 2;
}

message GetAccountStatementRequest {
  string account_id = 1;
  string from = 2; // Optional RFC3339 lower bound (inclusive) on transacted_at
  string to = 3; // Optional RFC3339 upper bound (inclusive) on transacted_at
  int32 limit = 4; // Page size (default 100, max 1000)
  int32 offset = 5; // Page offset
}

message GetAccountStatementResponse {
  string account_id = 1;
  string currency = 2;
  common.v1.Money opening_balance = 3;
  common.v1.Money closing_balance = 4;
  common.v1.Money total_debits = 5;
  common.v1.Money total_credits = 6;
  repeated StatementEntry entries = 7;
}

// -----------------------------------------------------
// Lifecycle transition request/response messages
// -----------------------------------------------------

message VoidTransactionRequest {
  string id = 1;
}

message VoidTransactionResponse {
  Transaction data = 1;
}

message MarkTransactionFailedRequest {
  string id = 1;
}

message MarkTransactionFailedResponse {
  Transaction data = 1;
}

// -----------------------------------------------------
// Ledger Service
// -----------------------------------------------------

// LedgerService provides double-entry bookkeeping and financial accounting.
// All RPCs require authentication via Bearer token.
service LedgerService {
  option (common.v1.service_permissions) = {
    namespace: "service_ledger"
    permissions: [
      "ledger_view",
      "ledger_manage",
      "account_view",
      "account_manage",
      "transaction_view",
      "transaction_manage",
      "book_view",
      "book_manage",
      "report_view"
    ]
    role_bindings: [
      {
        role: ROLE_OWNER
        permissions: [
          "ledger_view",
          "ledger_manage",
          "account_view",
          "account_manage",
          "transaction_view",
          "transaction_manage",
          "book_view",
          "book_manage",
          "report_view"
        ]
      },
      {
        role: ROLE_ADMIN
        permissions: [
          "ledger_view",
          "ledger_manage",
          "account_view",
          "account_manage",
          "transaction_view",
          "transaction_manage",
          "book_view",
          "book_manage",
          "report_view"
        ]
      },
      {
        role: ROLE_OPERATOR
        permissions: [
          "ledger_view",
          "account_view",
          "transaction_view",
          "transaction_manage",
          "book_view",
          "report_view"
        ]
      },
      {
        role: ROLE_VIEWER
        permissions: [
          "ledger_view",
          "account_view",
          "transaction_view",
          "book_view",
          "report_view"
        ]
      },
      {
        role: ROLE_MEMBER
        permissions: [
          "ledger_view",
          "account_view",
          "transaction_view",
          "book_view",
          "report_view"
        ]
      },
      {
        role: ROLE_SERVICE
        permissions: [
          "ledger_view",
          "ledger_manage",
          "account_view",
          "account_manage",
          "transaction_view",
          "transaction_manage",
          "book_view",
          "book_manage",
          "report_view"
        ]
      }
    ]
  };

  // SearchLedgers finds ledgers in the chart of accounts.
  // Supports filtering by type, parent, and custom properties.
  rpc SearchLedgers(common.v1.SearchRequest) returns (stream SearchLedgersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.method_permissions) = {
      permissions: ["ledger_view"]
    };
    option (gnostic.openapi.v3.operation) = {
      operation_id: "searchLedgers"
      summary: "Search ledgers"
      description: "Searches for ledgers in the chart of accounts. Supports filtering by ledger type, parent ledger, and custom properties. Returns a stream of matching ledgers."
      tags: "Ledgers"
    };
  }

  // CreateLedger creates a new ledger in the chart of accounts.
  // Ledgers can be hierarchical with parent-child relationships.
  rpc CreateLedger(CreateLedgerRequest) returns (CreateLedgerResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["ledger_manage"]
    };
    option (gnostic.openapi.v3.operation) = {
      operation_id: "createLedger"
      summary: "Create a new ledger"
      description: "Creates a new ledger in the chart of accounts. Ledgers represent accounting categories (Asset, Liability, Income, Expense, Capital) and can be organized hierarchically."
      tags: "Ledgers"
    };
  }

  // UpdateLedger updates an existing ledger's metadata.
  // The ledger type and reference cannot be changed.
  rpc UpdateLedger(UpdateLedgerRequest) returns (UpdateLedgerResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["ledger_manage"]
    };
    option (gnostic.openapi.v3.operation) = {
      operation_id: "updateLedger"
      summary: "Update ledger metadata"
      description: "Updates an existing ledger's metadata and properties. The ledger type and reference cannot be changed after creation."
      tags: "Ledgers"
    };
  }

  // SearchAccounts finds accounts matching specified criteria.
  // Supports filtering by ledger, balance range, and custom properties.
  rpc SearchAccounts(common.v1.SearchRequest) returns (stream SearchAccountsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.method_permissions) = {
      permissions: ["account_view"]
    };
    option (gnostic.openapi.v3.operation) = {
      operation_id: "searchAccounts"
      summary: "Search accounts"
      description: "Searches for accounts matching specified criteria. Supports filtering by ledger, balance range, currency, and custom properties. Returns a stream of matching accounts."
      tags: "Accounts"
    };
  }

  // CreateAccount creates a new account within a ledger.
  // Each account tracks balances and transaction history.
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["account_manage"]
    };
    option (gnostic.openapi.v3.operation) = {
      operation_id: "createAccount"
      summary: "Create a new account"
      description: "Creates a new account within a ledger. Accounts track balances (cleared, uncleared, reserved) and support multi-currency operations."
      tags: "Accounts"
    };
  }

  // UpdateAccount updates an existing account's metadata.
  // Balances are updated through transactions, not directly.
  rpc UpdateAccount(UpdateAccountRequest) returns (UpdateAccountResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["account_manage"]
    };
    option (gnostic.openapi.v3.operation) = {
      operation_id: "updateAccount"
      summary: "Update account metadata"
      description: "Updates an existing account's metadata and properties. Account balances are updated through transactions, not directly via this RPC."
      tags: "Accounts"
    };
  }

  // SearchTransactions finds transactions matching specified criteria.
  // Supports filtering by date range, account, currency, and status.
  rpc SearchTransactions(common.v1.SearchRequest) returns (stream SearchTransactionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.method_permissions) = {
      permissions: ["transaction_view"]
    };
    option (gnostic.openapi.v3.operation) = {
      operation_id: "searchTransactions"
      summary: "Search transactions"
      description: "Searches for transactions matching specified criteria. Supports filtering by date range, account, currency, cleared status, and transaction type. Returns a stream of matching transactions."
      tags: "Transactions"
    };
  }

  // CreateTransaction creates a new double-entry transaction.
  // All entries must be balanced (sum of debits = sum of credits).
  rpc CreateTransaction(CreateTransactionRequest) returns (CreateTransactionResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["transaction_manage"]
    };
    option (gnostic.openapi.v3.operation) = {
      operation_id: "createTransaction"
      summary: "Create a new transaction"
      description: "Creates a new double-entry transaction. The transaction must contain at least two entries with balanced debits and credits. Updates affected account balances automatically."
      tags: "Transactions"
    };
  }

  // ReverseTransaction reverses a transaction by creating offsetting entries.
  // Creates a new REVERSAL transaction that negates the original.
  rpc ReverseTransaction(ReverseTransactionRequest) returns (ReverseTransactionResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["transaction_manage"]
    };
    option (gnostic.openapi.v3.operation) = {
      operation_id: "reverseTransaction"
      summary: "Reverse a transaction"
      description: "Reverses a transaction by creating a new REVERSAL transaction with inverted entries. The original transaction remains in the ledger for audit purposes."
      tags: "Transactions"
    };
  }

  // UpdateTransaction updates a transaction's metadata.
  // Entries and amounts cannot be changed after creation.
  rpc UpdateTransaction(UpdateTransactionRequest) returns (UpdateTransactionResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["transaction_manage"]
    };
    option (gnostic.openapi.v3.operation) = {
      operation_id: "updateTransaction"
      summary: "Update transaction metadata"
      description: "Updates a transaction's metadata and properties. Transaction entries and amounts cannot be changed after creation - use ReverseTransaction to correct errors."
      tags: "Transactions"
    };
  }

  // SearchTransactionEntries finds individual transaction entries.
  // Useful for account statement generation and reconciliation.
  rpc SearchTransactionEntries(common.v1.SearchRequest) returns (stream SearchTransactionEntriesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.method_permissions) = {
      permissions: ["transaction_view"]
    };
    option (gnostic.openapi.v3.operation) = {
      operation_id: "searchTransactionEntries"
      summary: "Search transaction entries"
      description: "Searches for individual transaction entries. Useful for generating account statements, reconciliation, and detailed transaction analysis. Supports filtering by account, date range, and cleared status."
      tags: "Transactions"
    };
  }

  // VoidTransaction transitions a draft or pending transaction to VOIDED.
  // Posted activity cannot be voided — reverse it instead so the books
  // carry the offset and the audit trail.
  rpc VoidTransaction(VoidTransactionRequest) returns (VoidTransactionResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["transaction_manage"]
    };
    option (gnostic.openapi.v3.operation) = {
      operation_id: "voidTransaction"
      summary: "Void a not-yet-posted transaction"
      description: "Transitions a draft or pending transaction to VOIDED and stamps voided_at. Posted transactions cannot be voided; use ReverseTransaction so the books carry the offset and audit trail."
      tags: "Transactions"
    };
  }

  // MarkTransactionFailed transitions a pending transaction to FAILED for
  // upstream rejections (e.g. payment provider declined the webhook).
  rpc MarkTransactionFailed(MarkTransactionFailedRequest) returns (MarkTransactionFailedResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["transaction_manage"]
    };
    option (gnostic.openapi.v3.operation) = {
      operation_id: "markTransactionFailed"
      summary: "Mark a pending transaction failed"
      description: "Transitions a pending transaction to FAILED. Use when the upstream payment provider rejects the posting. Posted, voided, reversed and already-failed transactions cannot be marked failed."
      tags: "Transactions"
    };
  }

  // CreateBook creates a new accounting scope. Each book balances
  // independently; cross-book postings are rejected.
  rpc CreateBook(CreateBookRequest) returns (CreateBookResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["book_manage"]
    };
    option (gnostic.openapi.v3.operation) = {
      operation_id: "createBook"
      summary: "Create a new book"
      description: "Creates a new accounting scope. Books represent independent accounting entities (platform book, group book, merchant book, etc.). Optional parent_id supports hierarchy for consolidated reporting; cross-book postings are rejected regardless of hierarchy."
      tags: "Books"
    };
  }

  // GetBook fetches a single book by id within the caller's tenancy.
  rpc GetBook(GetBookRequest) returns (GetBookResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.method_permissions) = {
      permissions: ["book_view"]
    };
    option (gnostic.openapi.v3.operation) = {
      operation_id: "getBook"
      summary: "Get a book by id"
      description: "Retrieves the book with the given id within the caller's tenancy."
      tags: "Books"
    };
  }

  // ListBooksByType returns all books of a given conventional type.
  rpc ListBooksByType(ListBooksByTypeRequest) returns (ListBooksByTypeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.method_permissions) = {
      permissions: ["book_view"]
    };
    option (gnostic.openapi.v3.operation) = {
      operation_id: "listBooksByType"
      summary: "List books by type"
      description: "Returns all active books of the supplied conventional type (e.g. all group books, all merchant books) within the caller's tenancy."
      tags: "Books"
    };
  }

  // GetTrialBalance returns the per-account debit/credit totals plus per-
  // currency grand totals with the textbook integrity check (is_balanced).
  rpc GetTrialBalance(GetTrialBalanceRequest) returns (GetTrialBalanceResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.method_permissions) = {
      permissions: ["report_view"]
    };
    option (gnostic.openapi.v3.operation) = {
      operation_id: "getTrialBalance"
      summary: "Get trial balance"
      description: "Computes the trial balance across cleared NORMAL and REVERSAL transactions. Optional filters scope to currency, ledger, ledger type, book set (expand via ListBookDescendants for consolidation), and an as-of date."
      tags: "Reports"
    };
  }

  // GetAccountStatement returns a customer-facing account ledger for a
  // period with opening balance, running balance per entry, and totals.
  rpc GetAccountStatement(GetAccountStatementRequest) returns (GetAccountStatementResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.method_permissions) = {
      permissions: ["report_view"]
    };
    option (gnostic.openapi.v3.operation) = {
      operation_id: "getAccountStatement"
      summary: "Get an account statement"
      description: "Returns the account's entries in chronological order with running balance per entry, opening and closing balances, and the period's raw debit/credit totals."
      tags: "Reports"
    };
  }
}
