name: antinvestor_ui_ledger
description: >
  Ledger management UI library for Antinvestor. Embeddable screens and widgets
  for ledgers, accounts, transactions, and transaction entries.
version: 0.2.1
repository: https://github.com/antinvestor/service-payment
homepage: https://github.com/antinvestor/service-payment/tree/main/ui/ledger
issue_tracker: https://github.com/antinvestor/service-payment/issues
topics:
  - flutter
  - ui
  - ledger
  - antinvestor
  - accounting

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  antinvestor_ui_core: ^0.5.0
  antinvestor_api_ledger: ^1.52.0
  antinvestor_api_common: ^1.52.0
  connectrpc: ^1.0.0
  csv: ^8.0.0
  excel: ^4.0.6
  file_saver: ^0.3.0
  fixnum: ^1.1.0
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.0
  pdf: ^3.11.3
  printing: ^5.14.2
  protobuf: ^4.2.0
  riverpod_annotation: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  riverpod_generator: ^4.0.3

flutter:
  uses-material-design: true
