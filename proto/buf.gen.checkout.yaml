# Local Go codegen for the checkout service. The checkout package is not yet
# published to BSR so stubs are generated locally and checked in under
# apps/checkout/gen/. Run via proto-generate-checkout Makefile target.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/antinvestor/service-payments/apps/checkout/gen
    - file_option: go_package_prefix
      module: buf.build/antinvestor/common
      value: buf.build/gen/go/antinvestor/common/protocolbuffers/go
  disable:
    - file_option: go_package_prefix
      module: buf.build/bufbuild/protovalidate
    - file_option: go_package_prefix
      module: buf.build/googleapis/googleapis

plugins:
  - local: protoc-gen-go
    out: ../apps/checkout/gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: ../apps/checkout/gen
    opt: paths=source_relative
